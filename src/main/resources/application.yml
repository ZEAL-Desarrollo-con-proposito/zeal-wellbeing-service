server:
  port: 8081

spring:
  application:
    name: zeal-wellbeing-service
  datasource:
    url: jdbc:postgresql://localhost:5434/zeal_wellbeing_db
    username: zeal_user
    password: zeal_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379

app:
  jwt:
    secret: ZealMVP2026ArchitectureSoftwareSecretKeyMinimum256Bits!!
    expiration-ms: 86400000

logging:
  level:
    co.zeal: DEBUG
    org.hibernate.SQL: DEBUG
