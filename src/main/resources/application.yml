server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

spring:
  application:
    name: zeal-wellbeing-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/zeal_wellbeing_db}
    username: ${DB_USERNAME:zeal_user}
    password: ${DB_PASSWORD:zeal_password}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      # Una petición nunca espera indefinidamente un bloqueo de fila (SELECT ... FOR UPDATE).
      connection-init-sql: SET lock_timeout = '5s'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: wellbeing
        jdbc:
          time_zone: UTC
  flyway:
    schemas: wellbeing
    default-schema: wellbeing
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  time-zone: ${APP_TIME_ZONE:America/Bogota}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    jwt:
      # Debe coincidir en los tres servicios. En producción se inyecta siempre por variable de entorno.
      secret: ${JWT_SECRET:ZealMVP2026ArchitectureSoftwareSecretKeyMinimum256Bits!!}
      issuer: ${JWT_ISSUER:zeal}
      time-to-live: ${JWT_TTL:24h}
  booking:
    cancellation-notice: 24h
    freed-slot-offer-window: 5m
  room:
    opens-before-start: 10m
    ice-servers: ${ROOM_ICE_SERVERS:stun:stun.l.google.com:19302}
  demo-data:
    enabled: ${DEMO_DATA_ENABLED:true}

logging:
  level:
    co.zeal: INFO
