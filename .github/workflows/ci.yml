name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Pruebas unitarias y de integración (Testcontainers usa el Docker del runner).
      - name: Pruebas y empaquetado
        run: ./mvnw -B verify
      - name: Imagen Docker
        run: docker build -t ${{ github.event.repository.name }}:ci .
