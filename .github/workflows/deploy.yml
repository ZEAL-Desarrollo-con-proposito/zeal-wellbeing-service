name: Deploy

# R2-6 (ADR-12, ADR-13): cuando el CI de main termina en verde, construye la imagen, la publica en
# GitHub Container Registry y la despliega por SSH en las DOS VMs de este microservicio, una a la vez:
# primero la VM 1 y, solo si quedó lista (readiness), la VM 2. Mientras una se actualiza, la otra atiende
# detrás del balanceador. deploy-service.sh revierte y falla si una versión no queda lista.
#
# Secretos del entorno "production" (cowork): DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS, SERVICE_1_HOST y
# SERVICE_2_HOST (IP de cada VM del microservicio). Con VMs en cuentas distintas se llega directo por su IP
# pública, con una regla de SSH que admita el rango de GitHub Actions (ver runbook) o un runner propio.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

env:
  SERVICE: wellbeing
  IMAGE: ghcr.io/${{ github.repository_owner }}/zeal-wellbeing-service

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: tag
        run: echo "tag=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir y publicar
        run: |
          ref="$(echo "${IMAGE}" | tr '[:upper:]' '[:lower:]')"
          docker build -t "$ref:${{ steps.tag.outputs.tag }}" -t "$ref:latest" .
          docker push "$ref:${{ steps.tag.outputs.tag }}"
          docker push "$ref:latest"

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    strategy:
      max-parallel: 1        # Una VM a la vez
      fail-fast: true        # Si la VM 1 falla, la VM 2 no se toca
      matrix:
        vm: [SERVICE_1_HOST, SERVICE_2_HOST]
    steps:
      - name: Llave SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Desplegar en ${{ matrix.vm }}
        env:
          TARGET: ${{ secrets[matrix.vm] }}
          TAG: ${{ needs.publish.outputs.tag }}
        run: |
          ssh -o BatchMode=yes "deploy@$TARGET" \
            "/opt/zeal/zeal-infra-compose/deploy/scripts/deploy-service.sh $SERVICE $TAG"
